<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Taskmon</title>
  <style>
    :root {
      --bg: #141210; --card: #1f1c19; --line: #322d28; --fg: #ece7e1; --dim: #a39a90;
      --accent: #2dd4bf; --gold: #fcd34d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
    header {
      position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; background: #0d0c0b; border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 16px; letter-spacing: .04em; flex: 1; }
    header span { color: var(--gold); font-weight: 600; }
    header span.caps { color: var(--accent); }
    main { padding: 12px 14px 24px; display: flex; flex-direction: column; gap: 14px; }
    h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); font-weight: 600; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    .now { color: var(--dim); }
    .now b { color: var(--fg); font-weight: 600; }
    img.px { image-rendering: pixelated; display: block; }
    .mon { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
    .mon:first-of-type { border-top: 0; padding-top: 0; }
    .mon .nm { font-weight: 600; }
    .mon .sub { color: var(--dim); font-size: 12px; display: flex; gap: 6px; align-items: center; }
    .type { font-size: 10px; padding: 1px 6px; border-radius: 99px; color: #0c0a09; font-weight: 700; }
    .bars { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
    .bar { height: 5px; background: #0d0c0b; border-radius: 3px; overflow: hidden; }
    .bar > i { display: block; height: 100%; }
    .actions { display: flex; flex-direction: column; gap: 4px; }
    button {
      font: inherit; font-size: 12px; color: var(--fg); background: #2a2622; border: 1px solid var(--line);
      border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { background: #134e4a; border-color: #0f766e; }
    .badge { font-size: 11px; color: var(--accent); font-weight: 600; text-align: center; }
    .starters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .starter { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border: 1px solid var(--line); border-radius: 8px; }
    .zones { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .zones button { padding: 8px; text-align: left; display: flex; justify-content: space-between; }
    .zones button.on { border-color: var(--accent); background: #134e4a; }
    .shop { display: flex; flex-direction: column; gap: 8px; }
    .shop .row { display: flex; align-items: center; gap: 8px; }
    .shop .row .label { flex: 1; }
    .dex { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .dex div { text-align: center; font-size: 10px; color: var(--dim); background: #171512; border-radius: 6px; padding: 6px 2px; }
    .dex div img { margin: 0 auto 2px; }
    .dex div.caught { color: var(--fg); }
    .box-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .box-item span { flex: 1; }
    .muted { color: var(--dim); font-size: 12px; }
    label.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    footer { color: var(--dim); font-size: 11px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Taskmon</h1>
    <span id="coins">🪙 0</span>
    <span id="caps" class="caps">◓ 0</span>
  </header>
  <main id="app"><p class="muted">Conectando com a barra de tarefas…</p></main>
  <script src="../shared/bridge-fallback.js"></script>
  <script src="../shared/game.js"></script>
  <script src="../shared/sprites.js"></script>
  <script src="panel.js"></script>
</body>
</html>
