<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
  <title>Taskmon</title>
  <link rel="stylesheet" href="ds.css" />
  <style id="theme"></style>
</head>
<body>
  <header>
    <span class="led" title="Ligado"></span>
    <h1>TASKMON<small>dual screen</small></h1>
    <span class="chip coins" id="coins">0</span>
    <span class="chip caps" id="caps">0</span>
    <button class="gear" id="gear" title="Ajustes" aria-label="Ajustes">⚙</button>
    <button class="winbtn" data-win="min" title="Minimizar" aria-label="Minimizar">_</button>
    <button class="winbtn close" data-win="close" title="Fechar" aria-label="Fechar">X</button>
  </header>
  <div id="hero"></div>
  <div class="hinge" aria-hidden="true"></div>
  <nav id="tabs" hidden></nav>
  <main id="app"><p class="muted">Conectando com a barra de tarefas…</p></main>
  <dialog id="modal"></dialog>
  <script src="../shared/bridge-fallback.js"></script>
  <script src="../shared/moves.js"></script>
  <script src="../shared/items.js"></script>
  <script src="../shared/game.js"></script>
  <script src="../shared/sprites.js"></script>
  <script src="../shared/assets.js"></script>
  <script src="panel.js"></script>
</body>
</html>
