<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
  <title>Taskmon</title>
  <style>
    :root {
      --bg: #12100e; --bg2: #0b0a09; --card: #1c1916; --card2: #24201c; --line: #342e28;
      --fg: #efe9e2; --dim: #a1978c; --faint: #6f665d;
      --accent: #2dd4bf; --accent-bg: #0f3d39; --gold: #fcd34d; --hp: #4ade80; --xp: #38bdf8; --danger: #f87171;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html { scrollbar-color: var(--line) transparent; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
      font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; user-select: none;
    }
    button, input { font: inherit; }

    /* ---------- topo ---------- */
    header {
      position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: color-mix(in srgb, var(--bg2) 92%, transparent);
      backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    }
    header img { width: 22px; height: 22px; image-rendering: pixelated; }
    header h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .03em; flex: 1; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px;
      background: var(--card); border: 1px solid var(--line); font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums;
    }
    .chip.coins { color: var(--gold); }
    .chip.caps { color: var(--accent); }
    .chip .ico { width: 14px; height: 14px; image-rendering: pixelated; }

    /* ---------- herói ---------- */
    .hero {
      position: relative; margin: 12px 14px 0; border-radius: var(--radius); overflow: hidden;
      border: 1px solid var(--line); background: var(--card);
    }
    .stage {
      position: relative; height: 112px; display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 28px 14px; background: var(--stage-bg, linear-gradient(180deg, #1f2a2f, #1a1714));
      background-repeat: repeat-x; background-position: left bottom; background-size: auto 100%;
      image-rendering: pixelated;
    }
    .stage::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--ground-h, 14px);
      background: var(--ground-bg, var(--zone, #7cc46a)); background-repeat: repeat-x; background-size: auto 100%;
      opacity: var(--ground-op, .35); image-rendering: pixelated; z-index: 0;
    }
    .stage > * { position: relative; z-index: 1; }
    .stage .zone-name {
      position: absolute; top: 8px; left: 10px; font-size: 11px; font-weight: 600; color: #fff;
      background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 99px;
    }
    .stage .vs { align-self: center; color: rgba(255,255,255,.5); font-weight: 800; font-size: 12px; }
    .stage .wild { text-align: center; }
    .stage .wild small { display: block; font-size: 10px; color: #fff; background: rgba(0,0,0,.5); border-radius: 99px; padding: 0 6px; margin-bottom: 3px; white-space: nowrap; }
    .info { padding: 10px 14px 12px; display: grid; gap: 6px; }
    .info .row1 { display: flex; align-items: baseline; gap: 8px; }
    .info .row1 b { font-size: 15px; }
    .info .row1 .lv { color: var(--dim); font-weight: 600; }
    .info .row1 .grow { flex: 1; }
    .status { color: var(--dim); font-size: 12px; }
    .status b { color: var(--fg); font-weight: 600; }

    /* ---------- abas ---------- */
    nav {
      position: sticky; top: 45px; z-index: 4; display: flex; gap: 2px; margin: 12px 14px 0; padding: 3px;
      background: var(--bg2); border: 1px solid var(--line); border-radius: 10px;
    }
    nav button {
      flex: 1; padding: 6px 1px; font-size: 11.5px !important; letter-spacing: -.01em; border: 0; border-radius: 7px; background: transparent; color: var(--dim);
      font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    nav button:hover { color: var(--fg); }
    nav button.on { background: var(--card2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
    nav button .n { color: var(--faint); font-weight: 500; margin-left: 3px; }

    main { padding: 12px 14px 24px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
    h2 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); font-weight: 700; display: flex; justify-content: space-between; }
    .muted { color: var(--dim); font-size: 12px; }
    .empty { text-align: center; padding: 24px 12px; color: var(--dim); }

    /* ---------- sprites ---------- */
    .spr-box { display: inline-flex; align-items: flex-end; justify-content: center; flex: none; }
    .spr {
      display: block; background-repeat: no-repeat; background-position: 0 0;
      background-size: calc(var(--n, 1) * 100%) 100%; image-rendering: pixelated;
    }
    .spr.anim { animation: spr-frames var(--dur, .8s) steps(var(--n), jump-none) infinite; }
    .spr.flip { transform: scaleX(-1); }
    @keyframes spr-frames { from { background-position: 0 0; } to { background-position: 100% 0; } }

    /* ---------- criaturas ---------- */
    .mon {
      display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center;
      padding: 10px; border-radius: 10px; background: var(--card2); border: 1px solid transparent;
    }
    .mon + .mon { margin-top: 8px; }
    .mon.lead { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    .mon .portrait { width: 56px; height: 56px; border-radius: 8px; background: var(--bg2); display: flex; align-items: center; justify-content: center; }
    .mon .nm { font-weight: 600; display: flex; gap: 6px; align-items: center; }
    .mon .sub { color: var(--dim); font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 1px; }
    .type { font-size: 10px; padding: 1px 7px; border-radius: 99px; color: #0c0a09; font-weight: 700; }
    .st { font-size: 9px; padding: 1px 5px; border-radius: 4px; color: #0c0a09; font-weight: 800; letter-spacing: .03em; vertical-align: middle; }

    /* ---------- golpes ---------- */
    .mon .moves { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .move {
      display: flex; flex-direction: column; gap: 1px; padding: 5px 8px; border-radius: 7px; background: var(--bg2);
      border: 0; border-left: 3px solid var(--t); min-width: 0; cursor: pointer; text-align: left; color: var(--fg); font: inherit;
      transition: background .15s;
    }
    .move:hover { background: color-mix(in srgb, var(--t) 14%, var(--bg2)); }
    .move b { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .move span { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .move em { font-style: normal; }
    .new { display: inline-block; min-width: 15px; padding: 0 4px; border-radius: 99px; background: var(--gold); color: #0c0a09; font-size: 10px; font-weight: 800; }
    .editor { grid-column: 1 / -1; display: grid; gap: 8px; padding: 10px; border-radius: 8px; background: var(--bg2); border: 1px dashed var(--line); }
    .known { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .pick {
      display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; padding: 5px 8px; border-radius: 7px;
      background: var(--card2); border: 1px solid var(--line); border-left: 3px solid var(--t); cursor: pointer; font-size: 12px;
    }
    .pick.on { border-color: var(--accent); border-left-color: var(--t); }
    .pick input { margin: 0; accent-color: var(--accent); }
    .pick span { color: var(--dim); font-size: 11px; }
    .log { display: grid; gap: 1px; font-size: 11.5px; color: var(--dim); padding: 6px 8px; border-radius: 7px; background: var(--bg2); }
    .log div:last-child { color: var(--fg); }
    .log[hidden] { display: none; }

    /* ---------- sexo / creche / ovos ---------- */
    .g { font-weight: 800; font-size: 12px; }
    .g.m { color: #60a5fa; } .g.f { color: #f472b6; }
    .gear {
      width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
      color: var(--dim); font-size: 15px; cursor: pointer; line-height: 1;
    }
    .gear:hover, .gear.on { color: var(--fg); border-color: var(--accent); }
    .dc { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
    .dc-slot { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 6px; border-radius: 10px; background: var(--card2); text-align: center; min-height: 140px; justify-content: center; }
    .dc-slot.empty { border: 1px dashed var(--line); background: transparent; }
    .dc-heart { font-size: 18px; color: var(--faint); }
    .dc-heart.on { color: #f472b6; }
    .dc-mood { margin: 10px 0 6px; font-size: 13px; }
    .eggs { display: grid; gap: 8px; }
    .egg { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--card2); }
    .egg .grow, .dc-row .grow { flex: 1; min-width: 0; display: grid; gap: 3px; }
    .dc-row .grow { display: block; }
    .dc-pick { display: grid; gap: 6px; max-height: 320px; overflow: auto; }
    .dc-row { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 8px; background: var(--card2); }
    .pick { grid-template-columns: auto 1fr auto auto; }
    .pick .info {
      width: 18px; height: 18px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--bg2);
      color: var(--dim); font: 700 11px/1 inherit; cursor: pointer;
    }
    .pick .info:hover { color: var(--fg); border-color: var(--accent); }

    /* ---------- popup ---------- */
    dialog#modal {
      width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--line);
      border-radius: 14px; background: var(--card); color: var(--fg); box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }
    dialog#modal::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(2px); }
    .md { position: relative; padding: 16px; display: grid; gap: 12px; }
    .md-close {
      position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--card2); color: var(--dim); cursor: pointer; font-size: 13px;
    }
    .md-close:hover { color: var(--fg); border-color: var(--accent); }
    .md-head { border-left: 4px solid var(--t); padding-left: 10px; display: grid; gap: 6px; padding-right: 36px; }
    .md-head h3 { margin: 0; font-size: 18px; }
    .md-tags { display: flex; gap: 6px; align-items: center; }
    .cat { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 99px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
    .md-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .md-stats div { background: var(--bg2); border-radius: 8px; padding: 7px 4px; text-align: center; display: grid; gap: 1px; }
    .md-stats span { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
    .md-stats b { font-size: 15px; font-variant-numeric: tabular-nums; }
    .md-desc { margin: 0; padding: 0 0 0 18px; display: grid; gap: 4px; font-size: 13px; line-height: 1.45; }
    .md-desc li::marker { color: var(--accent); }
    .md-learn { display: grid; gap: 6px; font-size: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
    .lchip { display: inline-block; margin: 2px 2px 0 0; padding: 1px 7px; border-radius: 99px; background: var(--card2); border: 1px solid var(--line); font-size: 11px; color: var(--fg); }
    .lchip i { font-style: normal; color: var(--faint); }
    .lchip.link { cursor: pointer; font: inherit; font-size: 11px; font-weight: 700; }
    .lchip.link:hover { border-color: var(--accent); }
    .md-tm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
    .md-tm > b { font-size: 12px; letter-spacing: .06em; color: var(--dim); }
    .md h4 { margin: 4px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
    .teach-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; background: var(--card2); }
    .teach-row .grow { flex: 1; min-width: 0; }
    .teach-pick { display: grid; gap: 6px; margin: -4px 0 4px 18px; padding: 8px; border-radius: 8px; border: 1px dashed var(--line); background: var(--bg2); }
    .pick.swap { grid-template-columns: 1fr auto; text-align: left; color: var(--fg); font: inherit; font-size: 12px; }
    .pick.swap:hover { border-color: var(--danger); }
    .tag.excl { color: #fde68a; background: #4a3a10; }

    /* ---------- MTs ---------- */
    .tms { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .tm {
      display: grid; gap: 2px; text-align: left; padding: 9px 10px; border-radius: 10px; cursor: pointer; font: inherit; color: var(--fg);
      background: var(--card2); border: 1px solid var(--line); border-top: 3px solid var(--t); opacity: .78;
    }
    .tm.have { opacity: 1; }
    .tm:hover { border-color: var(--accent); border-top-color: var(--t); opacity: 1; }
    .tm-no { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--faint); }
    .tm b { font-size: 13px; }
    .tm-meta { font-size: 11px; color: var(--dim); }
    .tm-foot { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; font-size: 11px; }

    /* ---------- IV / esforço ---------- */
    .genes { gap: 4px; }
    .gene { display: grid; grid-template-columns: 84px 34px 82px 1fr auto; gap: 8px; align-items: center; font-size: 12px; min-height: 24px; }
    .gene .gk { color: var(--dim); }
    .gene .gv { text-align: right; font-variant-numeric: tabular-nums; }
    .iv { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 99px; text-align: center; background: var(--card2); color: var(--dim); cursor: help; }
    .iv.r2 { color: #a3e635; } .iv.r3 { color: #4ade80; } .iv.r4 { color: #38bdf8; }
    .iv.r5 { color: #0c0a09; background: var(--gold); }
    .iv.r0 { color: var(--danger); }
    .pips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
    .pips i { height: 8px; border-radius: 2px; background: var(--card2); box-shadow: inset 0 0 0 1px var(--line); }
    .pips i.on { background: var(--accent); box-shadow: none; }
    .pips i.on:nth-child(n+4) { background: #38bdf8; }
    .pips i.on:nth-child(n+7) { background: #a78bfa; }
    .pips i.on:nth-child(10) { background: var(--gold); }
    .gene .up { color: #4ade80; font-style: normal; font-size: 9px; }
    .gene .down { color: var(--danger); font-style: normal; font-size: 9px; }

    /* ---------- item de segurar ---------- */
    .held { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
    .held-empty { width: 20px; height: 20px; border-radius: 6px; border: 1px dashed var(--line); }
    .held select {
      font: inherit; font-size: 12px; color: var(--fg); background: var(--card2); border: 1px solid var(--line);
      border-radius: 7px; padding: 3px 6px; max-width: 200px;
    }
    .held select:disabled { opacity: .5; }
    .held-desc { flex-basis: 100%; font-size: 11px; color: var(--faint); }
    button.btn.mini { padding: 1px 6px; display: inline-flex; align-items: center; gap: 2px; font-weight: 700; }
    .bars { display: grid; gap: 3px; margin-top: 6px; }
    .bar { height: 5px; background: var(--bg2); border-radius: 3px; overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 3px; transition: width .4s ease; }
    .nums { color: var(--faint); font-size: 11px; margin-top: 3px; font-variant-numeric: tabular-nums; }
    .actions { display: flex; flex-direction: column; gap: 4px; }
    .tag { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-bg); padding: 1px 6px; border-radius: 99px; }

    /* ---------- botões ---------- */
    button.btn {
      font-size: 12px; color: var(--fg); background: var(--card2); border: 1px solid var(--line);
      border-radius: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s;
    }
    button.btn:hover:not(:disabled) { border-color: var(--accent); }
    button.btn:disabled { opacity: .4; cursor: default; }
    button.btn.primary { background: var(--accent-bg); border-color: #0f766e; }
    button.btn.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }

    /* ---------- inicial ---------- */
    .starters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .starter { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 10px; background: var(--card2); }

    /* ---------- caixa ---------- */
    .box { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
    .box-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border-radius: 10px; background: var(--card2); text-align: center; }
    .box-item .nm { font-weight: 600; font-size: 12px; }

    /* ---------- zonas ---------- */
    .zones { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .zone {
      position: relative; overflow: hidden; text-align: left; padding: 0; border-radius: 10px; cursor: pointer;
      background: var(--card2); border: 1px solid var(--line); color: var(--fg);
    }
    .zone:hover:not(:disabled) { border-color: var(--accent); }
    .zone:disabled { cursor: default; }
    .zone:disabled .preview, .zone:disabled .zt { filter: grayscale(1) brightness(.6); }
    .zone.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .zone .preview { height: 44px; background: var(--zone); background-repeat: repeat-x; background-position: left bottom; background-size: auto 100%; image-rendering: pixelated; }
    .zone .zt { padding: 7px 10px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
    .zone .zt b { font-size: 13px; }
    .zone .here { position: absolute; top: 6px; right: 6px; }

    /* ---------- loja ---------- */
    .shop { display: grid; gap: 8px; }
    .shop .row { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; background: var(--card2); }
    .shop .row .label { flex: 1; display: grid; }
    .shop .row .label b { font-weight: 600; }

    /* ---------- bestiário ---------- */
    .dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
    .dex > div { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--faint); background: var(--card2); border-radius: 8px; padding: 6px 2px 7px; }
    .dex > div .no { font-size: 9px; color: var(--faint); align-self: flex-start; margin-left: 6px; }
    .dex > div.seen { color: var(--dim); }
    .dex > div.caught { color: var(--fg); }
    .progress { height: 6px; background: var(--bg2); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
    .progress i { display: block; height: 100%; background: var(--accent); }

    /* ---------- ajustes ---------- */
    .setting { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 8px 0; }
    .setting + .setting { border-top: 1px solid var(--line); }
    .switch { position: relative; width: 36px; height: 20px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: .2s; cursor: pointer; }
    .switch span::after { content: ""; position: absolute; width: 14px; height: 14px; top: 3px; left: 3px; border-radius: 50%; background: var(--fg); transition: .2s; }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(16px); background: #062a27; }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
    code { font: 11px/1.5 Consolas, "Cascadia Mono", monospace; background: var(--bg2); padding: 1px 5px; border-radius: 4px; color: var(--dim); }
    ul.files { margin: 6px 0 0; padding-left: 18px; color: var(--dim); font-size: 12px; max-height: 120px; overflow: auto; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .stats div { background: var(--card2); border-radius: 8px; padding: 8px 4px; }
    .stats b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
    .stats span { font-size: 11px; color: var(--dim); }
  </style>
  <style id="theme"></style>
</head>
<body>
  <header>
    <img src="../assets/icon.png" alt="" />
    <h1>Taskmon</h1>
    <span class="chip coins" id="coins">🪙 0</span>
    <span class="chip caps" id="caps">◓ 0</span>
    <button class="gear" id="gear" title="Ajustes" aria-label="Ajustes">⚙</button>
  </header>
  <div id="hero"></div>
  <nav id="tabs" hidden></nav>
  <main id="app"><p class="muted">Conectando com a barra de tarefas…</p></main>
  <dialog id="modal"></dialog>
  <script src="../shared/bridge-fallback.js"></script>
  <script src="../shared/moves.js"></script>
  <script src="../shared/items.js"></script>
  <script src="../shared/game.js"></script>
  <script src="../shared/sprites.js"></script>
  <script src="../shared/assets.js"></script>
  <script src="panel.js"></script>
</body>
</html>
