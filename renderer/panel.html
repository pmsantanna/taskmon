<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
  <title>Taskmon</title>
  <link rel="stylesheet" href="ds.css" />
</head>
<body>
  <div id="device">
    <div class="bezel">
      <span class="led" aria-hidden="true"></span>
      <span class="title">TASKMON<small>duas telas</small></span>
      <button data-win="min" title="Minimizar" aria-label="Minimizar">_</button>
      <button class="close" data-win="close" title="Fechar" aria-label="Fechar">X</button>
    </div>
    <section id="top" class="screen" aria-label="Tela de cima"></section>
    <div class="hinge" aria-hidden="true"><i></i><i></i></div>
    <section id="bottom" class="screen" aria-label="Tela de baixo"><p class="muted">Conectando com a barra de tarefas…</p></section>
  </div>
  <dialog id="modal"></dialog>
  <script src="../shared/bridge-fallback.js"></script>
  <script src="../shared/moves.js"></script>
  <script src="../shared/items.js"></script>
  <script src="../shared/game.js"></script>
  <script src="../shared/dex.js"></script>
  <script src="../shared/sprites.js"></script>
  <script src="../shared/assets.js"></script>
  <script src="panel.js"></script>
</body>
</html>
